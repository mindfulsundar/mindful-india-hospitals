<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>India Hospitals: What Must Be True | Mindful Finance</title>
<meta name="description" content="Revised interactive initiating-coverage deck on ten listed Indian hospital platforms: valuation range, reverse valuation, SOTP, scenarios, Monte Carlo and a valuation lab. Mindful Finance.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta property="og:title" content="India Hospitals: What Must Be True | Mindful Finance">
<meta property="og:description" content="Revised interactive initiating-coverage deck on ten listed Indian hospital platforms.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e60023;--red-press:#cc001f;
  --canvas:#ffffff;--soft:#fbfbf9;--card:#f6f6f3;--sec:#e5e5e0;--sec-press:#c8c8c1;--hair:#dadad3;--hair-soft:#e5e5e0;
  --ink:#000000;--body:#33332e;--mute:#62625b;--ash:#91918c;--stone:#c8c8c1;
  --dark:#262622;--on-dark:#ffffff;
  --err:#9e0a0a;--err-pale:#fbe3e3;--succ:#103c25;--succ-pale:#c7f0da;
  --focus:#435ee5;--blue:#617bff;--purple:#7e238b;
  --mf-navy:#12294d;--mf-gold:#e3a72f;
  --r-md:16px;--r-lg:32px;--r-full:9999px;
  --font-d:'Manrope','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-b:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#151513;--soft:#1a1a17;--card:#242420;--sec:#34342f;--sec-press:#4a4a43;--hair:#3b3b35;--hair-soft:#2c2c27;
    --ink:#ffffff;--body:#dcdcd6;--mute:#a9a9a2;--ash:#7d7d77;--stone:#4a4a43;--dark:#0d0d0b;
    --err:#ff9a9a;--err-pale:#3a1c1c;--succ:#8ee8b5;--succ-pale:#143826;--focus:#8ea0ff;
  }
}
:root[data-theme="dark"]{
  --canvas:#151513;--soft:#1a1a17;--card:#242420;--sec:#34342f;--sec-press:#4a4a43;--hair:#3b3b35;--hair-soft:#2c2c27;
  --ink:#ffffff;--body:#dcdcd6;--mute:#a9a9a2;--ash:#7d7d77;--stone:#4a4a43;--dark:#0d0d0b;
  --err:#ff9a9a;--err-pale:#3a1c1c;--succ:#8ee8b5;--succ-pale:#143826;--focus:#8ea0ff;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--canvas);color:var(--body);font-family:var(--font-b);font-size:16px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 4px var(--canvas)}
input[type=range]:focus-visible{outline-offset:6px}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- nav ---------- */
.nav{flex:none;height:64px;background:var(--canvas);display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--hair-soft);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--font-d);font-weight:800;font-size:17px;letter-spacing:-.4px;color:var(--ink);white-space:nowrap}
.brand small{display:none;color:var(--mute);font-size:14px;padding-left:12px;border-left:1px solid var(--hair);white-space:nowrap}
.nav-title{display:none;flex:1;min-width:0;text-align:center;font-weight:600;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:6px 16px;border-radius:var(--r-md);font-weight:700;font-size:14px;line-height:1;white-space:nowrap;min-width:44px}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:active{background:var(--red-press)}
.btn-secondary{background:var(--sec);color:var(--ink)}
.btn-secondary:active{background:var(--sec-press)}
.btn-ghost{color:var(--ink)}
.btn[disabled]{background:var(--card);color:var(--ash);cursor:default}
.btn-circ{width:44px;height:44px;border-radius:var(--r-full);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn-circ:active{background:var(--sec)}
.btn-circ[disabled]{color:var(--stone)}
.counter{height:40px;padding:0 14px;border-radius:var(--r-full);background:var(--card);font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}

/* ---------- stage ---------- */
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--soft)}
.track{display:flex;height:100%;transition:transform .45s cubic-bezier(.3,.7,.2,1);will-change:transform}
.slide{flex:none;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:1280px;margin:0 auto;padding:32px 16px 48px}
.dock{flex:none;height:64px;background:var(--canvas);border-top:1px solid var(--hair-soft);display:flex;align-items:center;gap:12px;padding:0 16px}
.dots{flex:1;display:flex;gap:6px;align-items:center;justify-content:center}
.dot{flex:1;max-width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.dot i{display:block;width:100%;height:6px;border-radius:var(--r-full);background:var(--sec);transition:background .3s}
.dot[aria-current="true"] i{background:var(--ink)}
.dot.seen i{background:var(--stone)}
.dot[aria-current="true"].seen i{background:var(--ink)}

/* ---------- type ---------- */
.d-xl{font-family:var(--font-d);font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-1.2px;color:var(--ink)}
.d-lg{font-family:var(--font-d);font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.8px;color:var(--ink)}
.h-xl{font-family:var(--font-d);font-weight:700;font-size:28px;line-height:1.2;letter-spacing:-1.2px;color:var(--ink)}
.h-lg{font-family:var(--font-d);font-weight:700;font-size:22px;line-height:1.25;color:var(--ink)}
.h-md{font-weight:600;font-size:18px;line-height:1.3;color:var(--ink)}
.lead{font-size:18px;line-height:1.45;color:var(--body);max-width:62ch}
.p{font-size:16px;color:var(--body);max-width:68ch}
.sm{font-size:14px;color:var(--mute)}
.cap{font-size:12px;font-weight:500;color:var(--mute);line-height:1.5}
.strong{font-weight:600;color:var(--ink)}
.stack>*+*{margin-top:16px}
.stack-lg>*+*{margin-top:32px}
.head{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}

/* ---------- pieces ---------- */
.card{background:var(--card);border-radius:var(--r-md);padding:16px}
.card.white{background:var(--canvas)}
.feature{background:var(--canvas);border-radius:var(--r-md);padding:20px}
.feature.soft{background:var(--card)}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
.g4{grid-template-columns:1fr 1fr}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{height:44px;padding:0 16px;border-radius:var(--r-full);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;white-space:nowrap}
.chip:active{background:var(--sec)}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--canvas)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapit{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:var(--r-full);background:var(--canvas);color:var(--ink);font-size:12px;font-weight:700}
.pill.pos{background:var(--succ-pale);color:var(--succ)}
.pill.neg{background:var(--err-pale);color:var(--err)}
.pill.dark{background:var(--ink);color:var(--canvas)}
.stat{display:flex;flex-direction:column;gap:4px;background:var(--card);border-radius:var(--r-md);padding:16px}
.stat .v{font-family:var(--font-d);font-weight:700;font-size:24px;letter-spacing:-1px;color:var(--ink);line-height:1.05}
.stat .l{font-size:14px;color:var(--mute)}
.note{background:var(--card);border-radius:var(--r-md);padding:16px;font-size:14px;color:var(--body)}
.note b{color:var(--ink)}
.rule{height:1px;background:var(--hair);border:0;margin:0}

/* sliders */
.ctl{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl-h label{font-weight:600;font-size:14px;color:var(--ink)}
.ctl-h label{flex:1}
.ctl-h output{white-space:nowrap;flex:none;font-weight:700;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9999px;background:var(--sec-press);background:linear-gradient(to right,var(--ink) var(--p,50%),var(--sec) var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:9999px;background:var(--sec)}
input[type=range]::-moz-range-progress{height:6px;border-radius:9999px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--canvas);border:3px solid var(--ink);margin-top:-10px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--canvas);border:3px solid var(--ink)}

/* bars */
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:104px 1fr 64px;align-items:center;gap:10px;min-height:36px;border-radius:var(--r-md);padding:0 8px;text-align:left;width:100%}
.bar-row.sel{background:var(--card)}
.bar-row .n{font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .v{font-weight:700;font-size:14px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.bar-track{height:20px;border-radius:var(--r-full);background:var(--card);position:relative;overflow:hidden}
.bars.onsoft .bar-track{background:var(--canvas)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full);background:var(--ink);width:0;transition:width .7s cubic-bezier(.3,.7,.2,1),background .3s}
.bar-fill.lite{background:var(--stone)}
.div-track{height:22px;position:relative;background:var(--card);border-radius:var(--r-full);overflow:hidden}
.div-track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ash)}
.div-fill{position:absolute;top:3px;bottom:3px;width:0;transition:width .7s cubic-bezier(.3,.7,.2,1),left .7s cubic-bezier(.3,.7,.2,1)}
.div-fill.neg{background:var(--err);border-radius:var(--r-full) 0 0 var(--r-full);right:50%}
.div-fill.pos{background:var(--succ);border-radius:0 var(--r-full) var(--r-full) 0;left:50%}

/* masonry of pins */
.masonry{columns:2;column-gap:8px}
.pin{break-inside:avoid;background:var(--card);border-radius:var(--r-md);margin-bottom:8px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%;transition:opacity .35s,transform .35s,box-shadow .2s;box-shadow:inset 0 0 0 0 var(--ink)}
.pin.on{box-shadow:inset 0 0 0 2px var(--ink);background:var(--canvas)}
.pin.dim{opacity:.35}
.pin .nm{font-weight:600;font-size:14px;color:var(--ink)}
.pin .big{font-family:var(--font-d);font-weight:700;font-size:34px;letter-spacing:-1px;line-height:1;margin:14px 0 10px}
.pin .big.neg{color:var(--err)}.pin .big.pos{color:var(--succ)}
.pin .meta{font-size:12px;color:var(--mute);line-height:1.5}

/* tables */
.tablewrap{overflow-x:auto;border-radius:var(--r-md);background:var(--canvas);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
th{font-weight:700;color:var(--ink);text-align:right;padding:12px 12px;border-bottom:1px solid var(--hair);white-space:nowrap;background:var(--canvas)}
td{padding:12px;text-align:right;border-bottom:1px solid var(--hair-soft);color:var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--canvas);color:var(--ink);font-weight:600}
tr.sel td{background:var(--card)}
tr.sel td:first-child{background:var(--card)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.scrim.open{display:flex}
.modal{background:var(--canvas);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:720px;max-height:86%;overflow:auto;box-shadow:0 0 16px rgba(0,0,0,.25);animation:rise .3s cubic-bezier(.3,.7,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.index-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.index-item{background:var(--card);border-radius:var(--r-md);padding:12px 14px;text-align:left;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.index-item.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.index-item span{font-size:12px;color:var(--mute);font-weight:500}
.index-item b{font-size:14px;color:var(--ink);line-height:1.25}

/* cover */
.cover-grid{display:grid;gap:32px}
.chain{display:flex;flex-wrap:wrap;gap:6px}
.chain span{height:32px;padding:0 12px;border-radius:var(--r-full);background:var(--card);color:var(--mute);font-size:13px;font-weight:600;display:inline-flex;align-items:center;transition:background .4s,color .4s}
.chain span.lit{background:var(--ink);color:var(--canvas)}
.beds{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.bed{aspect-ratio:1;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 2px var(--stone);transition:background .35s,box-shadow .35s}
.bed.open{box-shadow:inset 0 0 0 2px var(--ash)}
.bed.occ{background:var(--ink);box-shadow:none}
.bed.closed{opacity:.35}

/* misc */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-weight:500}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
svg text{font-family:var(--font-b)}
.tip{font-size:12px;color:var(--mute)}
.seg{display:inline-flex;background:var(--card);border-radius:var(--r-full);padding:4px}
.seg button{height:36px;padding:0 14px;border-radius:var(--r-full);font-weight:700;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--canvas)}
.flow{display:flex;flex-direction:column;gap:8px}
.flow-step{background:var(--card);border-radius:var(--r-md);padding:14px 16px;text-align:left;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:background .25s}
.flow-step.on{background:var(--ink)}
.flow-step.on *{color:var(--canvas)!important}
.flow-step b{font-size:15px;color:var(--ink)}
.flow-step span{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.tile{background:var(--card);border-radius:var(--r-md);padding:16px;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px;min-height:88px}
.tile.open{background:var(--canvas);box-shadow:inset 0 0 0 2px var(--ink)}
.tile .more{font-size:14px;color:var(--body);display:none}
.tile.open .more{display:block}
.tile .h-md{display:flex;justify-content:space-between;gap:8px;align-items:center}
.heat{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.heat div{padding:10px 6px;border-radius:12px;text-align:center;background:var(--card);color:var(--ink);font-weight:600}
.heat .hd{background:transparent;color:var(--mute);font-weight:600;font-size:12px;padding:6px 4px}
.heat .hi{background:var(--succ-pale);color:var(--succ)}
.heat .base{box-shadow:inset 0 0 0 2px var(--ink)}
.foot{padding:32px 16px;border-top:1px solid var(--hair);background:var(--canvas)}
.fade-in{animation:fadein .5s both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (min-width:640px){
  .nav-title{display:block}
  .wrap{padding:40px 24px 64px}
  .brand small{display:inline}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .g4{grid-template-columns:repeat(4,1fr)}
  .masonry{columns:3}
  .bar-row{grid-template-columns:130px 1fr 72px}
  .index-list{grid-template-columns:repeat(3,1fr)}
  .scrim{align-items:center;padding:24px}
  .modal{border-radius:var(--r-lg);padding:32px}
  .chips{margin:0;padding-left:0;padding-right:0}
}
@media (min-width:960px){
  .d-xl{font-size:70px}
  .d-lg{font-size:44px}
  .cover-grid{grid-template-columns:1.1fr .9fr;align-items:center;gap:48px}
  .masonry{columns:4}
  .nav{padding:0 24px}.dock{padding:0 24px}
  .two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .two-col.wide-l{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
  .stat.big .v{font-size:40px}
}
@media (max-width:420px){
  .brand b{font-size:15px}
  .nav{gap:8px;padding:0 12px}
  .btn{padding:6px 14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

.stat.big .v{font-size:32px}
.gr{transform-box:fill-box;transform-origin:bottom;animation:grow .6s both cubic-bezier(.3,.7,.2,1)}
@keyframes grow{from{transform:scaleY(0)}}
.dr{stroke-dasharray:1;animation:draw 1s both cubic-bezier(.3,.7,.2,1)}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

.nav-spacer{flex:1}
.brand{flex:1}
@media (min-width:640px){.brand{flex:none}}
.sticky-strip{position:sticky;top:0;z-index:4;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;background:var(--ink);color:var(--canvas);border-radius:var(--r-md);padding:10px 16px;margin:12px 0 0;font-size:12px;font-weight:500}
.sticky-strip b{font-size:15px;font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
@media (max-width:959px){.rev-m{display:flex;flex-direction:column;gap:24px}.rev-m>:last-child{order:-1}}
@media (min-width:960px){.sticky-strip{display:none}}

.grid>*,.two-col>*,.rev-m>*{min-width:0}
.tile{min-height:56px}
.flow-step span{white-space:nowrap}
.flow-step b{min-width:0}

/* ---- revised deck additions ---- */
.rg{display:flex;flex-direction:column;gap:2px}
.rg-row{display:grid;grid-template-columns:104px 1fr 56px;align-items:center;gap:10px;min-height:44px;border-radius:var(--r-md);padding:0 8px;text-align:left;width:100%}
.rg-row.sel{background:var(--card)}
.rg-row .n{font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg-row .v{font-weight:700;font-size:14px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.rg-track{position:relative;height:26px;background:var(--card);border-radius:var(--r-full)}
.rg-row.sel .rg-track{background:var(--canvas)}
.rg-bar{position:absolute;top:6px;bottom:6px;border-radius:var(--r-full);background:var(--stone);transition:left .6s cubic-bezier(.3,.7,.2,1),width .6s cubic-bezier(.3,.7,.2,1)}
.rg-tick{position:absolute;top:2px;bottom:2px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink);transition:left .6s cubic-bezier(.3,.7,.2,1)}
.rg-mk{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ash);transition:left .6s cubic-bezier(.3,.7,.2,1);z-index:1}
.rg-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);padding:6px 74px 0 122px}

.rv-row.sel{background:var(--card)}

.rv-track{display:flex;flex-direction:column;gap:4px}

.rv-b.base{background:var(--ink)}.rv-b.imp{background:var(--stone)}
.stk{display:flex;height:42px;border-radius:var(--r-md);overflow:hidden;background:var(--card)}
.stk-seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:width .5s cubic-bezier(.3,.7,.2,1);white-space:nowrap;overflow:hidden}

.tr-row{display:grid;grid-template-columns:84px 1fr 68px;gap:10px;align-items:center;min-height:50px}

.tr-fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full);background:var(--ink);transition:width .6s cubic-bezier(.3,.7,.2,1),opacity .3s}
.tr-fill.lite{background:var(--stone)}
.tr-mk{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--ash);z-index:2;transition:left .5s}

.legend i.sq{border-radius:2px}

/* Valuation engine, mirrors the revised workbook.
   UFCF = NOPAT + D&A - capex - dNWC; ND_t = ND_t-1 - (CFO - capex); year-end discounting.
   Corrected bridge: DCF equity = DCF EV - FY26 opening net debt. basis:'legacy' reproduces the old FY31E bridge.
   Relative EV/EBITDA keeps the workbook convention (FY28E EBITDA x multiple - FY28E net debt). */
function runModel(c, o) {
  o = Object.assign({dg:0, dm:0, dmode:'phase', cx:1, wacc:c.wacc, tg:c.tg, evx:c.evx, pe:c.pe, nwc:null, basis:'fy26'}, o||{});
  const n = 5, rev = [c.rev[3]], out = {rev:[], ebitda:[], ufcf:[], nd:[], pat:[], capex:[], pv:[]};
  let nd = c.nd[3] == null ? 0 : c.nd[3];
  const nd0 = nd; let ev = 0;
  for (let t = 1; t <= n; t++) {
    const gr = c.g[t-1] + o.dg;
    const rv = rev[t-1] * (1 + gr); rev.push(rv);
    const shift = o.dmode === 'flat' ? o.dm : o.dm * t / n;
    const mg = c.m[t-1] + shift;
    const eb = rv * mg, da = rv * c.da, ebit = eb - da, nopat = ebit * (1 - c.tax);
    const capInt = c.capex[3+t] / c.rev[3+t];
    const cap = rv * capInt * o.cx;
    const nw = Math.max(rv - rev[t-1], 0) * (o.nwc != null ? o.nwc : c.nwc);
    const uf = nopat + da - cap - nw;
    nd = nd - (eb * c.cfo - cap);
    const pat = (ebit - c.int[3+t]) * (1 - c.tax);
    const df = 1 / Math.pow(1 + o.wacc, t);
    ev += uf * df;
    out.rev.push(rv); out.ebitda.push(eb); out.ufcf.push(uf); out.nd.push(nd); out.pat.push(pat); out.capex.push(cap); out.pv.push(uf*df);
  }
  const tv = out.ufcf[4] * (1 + o.tg) / (o.wacc - o.tg);
  const pvtv = tv / Math.pow(1 + o.wacc, n);
  const dcfEV = ev + pvtv;
  const dcf = dcfEV - (o.basis === 'legacy' ? out.nd[4] : nd0);
  const eve = o.evx * out.ebitda[1] - out.nd[1];
  const pe = o.pe * out.pat[1];
  return Object.assign(out, {dcf, eve, pe, gap: dcf / c.mcap - 1, dcfEV, pvx: ev, pvtv, tvShare: pvtv / dcfEV, nd0});
}

function simHosp(p,delay){
  const occ=p.occ/100,op=p.op/100,vc=p.varc/100,m=p.mar/100,ag=p.ag/100;
  const revM=p.beds*occ*365*p.arpob*(1+op)/1e4,fixed0=revM*(1-vc-m),capex=p.beds*p.cpb;
  const rows=[];let cum=-capex,be=null,pb=null,peak=-capex;
  for(let y=1;y<=10;y++){
    const ye=y-delay;
    const o=ye<1?occ*.25:occ*(.3+.7*Math.min(1,(ye-1)/Math.max(1,p.ramp-1)));
    const arp=p.arpob*Math.pow(1+ag,y-1);
    const rev=p.beds*o*365*arp*(1+op)/1e4,fx=fixed0*Math.pow(1.05,y-1),eb=rev*(1-vc)-fx;
    cum+=eb;peak=Math.min(peak,cum);
    if(be==null&&eb>0)be=y;if(pb==null&&cum>=0)pb=y;
    rows.push({y,o,rev,eb,mg:eb/rev,disc:p.beds*o*365/p.alos,obd:p.beds*o*365,cum,roic:(eb-capex/20)*.75/capex});
  }
  const my=Math.min(10,delay+p.ramp);
  return {rows,capex,be,pb,peak:-peak,roic:rows[my-1].roic,my};
}

function sotpCalc(c,p){
  const e26=c.ebitda[3],mat=e26*p.sh,ramp=e26-mat,mev=mat*p.mx,rev=ramp*p.mx*p.rf;
  const m31=e26*Math.pow(1+p.g,5),inc=Math.max(c.ebitda[8]-m31,0),fut=inc*p.mx*p.pf/Math.pow(1+c.wacc,5);
  const ev=mev+rev+fut;return {mev,rev,fut,ev,eq:ev-(c.nd[3]||0),inc};
}

const MCN=4000,MCZ={};
function rngf(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mcZ(k){
  if(MCZ[k])return MCZ[k];
  const r=rngf(20261001),nm=()=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())};
  const a=[];for(let i=0;i<MCN;i++)a.push([nm(),nm(),nm(),nm(),nm(),nm()]);return MCZ[k]=a;
}
const MCS={cagr:2.5,m:1.8,w:0.7};
function mcRun(k){
  const c=D[k],z=mcZ(k),out=new Array(MCN);
  for(let i=0;i<MCN;i++){const q=z[i],w=q[2]*MCS.w/100,wacc=c.wacc+w,tg=Math.min(c.tg+q[3]*.004,wacc-.015);

  return out;
}
const pctl=(s,p)=>{const i=(s.length-1)*p,f=Math.floor(i);return s[f]+(s[Math.min(f+1,s.length-1)]-s[f])*(i-f)};

<div class="feature soft" style="margin-top:16px"><p class="h-md">What would change the view</p><p class="p" style="margin-top:8px">A material change in commissioning timelines, occupancy ramp, ARPOB and case mix, capex intensity, cash conversion or required return should be reflected first in the operating model and only then in valuation. A single soft quarter during commissioning says less than whether new hospitals are following the expected ramp.</p></div>
</div>`,
init(){},
on(act,k,root){if(act==='cat'){$$('#catseg button',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));$$('.cp',root).forEach(e=>e.style.display=k==='neg'?'none':'flex');$$('.cn',root).forEach(e=>e.style.display=k==='pos'?'none':'flex')}}});

html:()=>`<div class="wrap">
<div class="head"><h2 class="d-lg">The operating forecast comes first. Valuation never gets reverse-engineered.</h2>
<p class="lead">The preferred hospital build is bottom-up: beds \u00D7 occupancy \u00D7 365 gives occupied bed days. Divide by ALOS for discharges. Multiply by ARPOB for inpatient revenue, then add outpatient and other income. Try it.</p></div>
<div class="two-col">
 <div class="feature"><h3 class="h-md" style="margin-bottom:8px">The bottom-up build</h3>

  <button class="btn btn-secondary" style="margin-top:12px" data-act="walk">Walk through the steps</button></div>
 <div class="flow" id="flow"></div>
</div>
<h3 class="h-lg" style="margin:32px 0 12px">Eight pieces of the revised valuation</h3>
<div class="grid g2">${[['Corrected DCF','Enterprise value converts to equity using FY26 opening net debt or cash.'],['Terminal audit','Terminal share of EV, terminal reinvestment and implied terminal ROIC are visible.'],['Reverse operating valuation','Solves for the EBITDA margin and terminal economics consistent with current EV.'],['Mature/ramping SOTP','Separates current mature EBITDA, ramping assets and probability-weighted future growth.'],['Scenario tree','Uses business-driver changes rather than mechanical valuation haircuts.'],['Monte Carlo','Provides P10, P50 and P90 distributions instead of one precise number.'],['Bed economics','EV per bed, revenue per bed, occupancy and replacement cost are secondary diagnostics.'],['Primary output','Low, central and high model references, plus the market expectation gap.']].map(([a,b])=>`<div class="card white"><p class="h-md">${a}</p><p class="p" style="margin-top:6px">${b}</p></div>`).join('')}</div>
<h3 class="h-lg" style="margin:32px 0 12px">What the revision did to the headline gap</h3>
<div class="tablewrap noswipe"><table><thead><tr><th>Company</th><th>Legacy weighted gap</th><th>Corrected DCF gap</th><th>Central reference vs market cap</th></tr></thead><tbody>
${COS.map(k=>{const c=D[k];return `<tr><td>${FULLNAME[k]}</td><td>${sp(c.val.gap)}</td><td>${sp(c.ta.dcf/c.mcap-1)}</td><td>${sp(c.vr.ce/c.mcap-1)}</td></tr>`}).join('')}</tbody></table></div>
<p class="cap" style="margin-top:8px">Legacy weighted gap was the 50/25/25 blend of DCF, EV/EBITDA and P/E on the old bridge. The central reference is the median of six lenses.</p>
<div class="grid g2" style="margin-top:32px">
 <div class="feature"><h3 class="h-lg">Important limitations</h3><div class="stack" style="margin-top:8px">${['The model is an analytical scenario, not management guidance or an investment recommendation.','Bed definitions, occupancy and ARPOB are not standardized perfectly across companies.','Mature/ramping SOTP assumptions are analyst estimates, because companies rarely disclose complete asset-stage splits.','Monte Carlo distributions are only as good as the chosen input distributions and do not eliminate model risk.','Replacement cost does not capture brand, doctor networks, specialty capabilities or local market power.','Current market capitalisations change daily and should be refreshed before using the expectation map.'].map(x=>`<p class="p">${x}</p>`).join('')}</div></div>
 <div class="stack">
  <div class="note"><b>Workbook checks:</b> ${CHECKS[1]} of ${CHECKS[0]} pass. The other ${CHECKS[0]-CHECKS[1]} are intentional warnings that terminal value exceeds 75% of EV for every company.</div>
  <div class="note"><b>One convention to know.</b> The relative EV/EBITDA lens still deducts FY28E net debt, as in the original model. Using FY26 net debt instead would move those values by between ${MIN}6% and +4% and would not change any company\u2019s position against the range.</div>
 </div></div></div>`,
init(root){
  const paint=walk=>{
    const v=id=>+$('#'+id,root).value,beds=v('m-beds'),occ=v('m-occ')/100,ar=v('m-arpob'),alos=v('m-alos'),op=v('m-op')/100;
    const obd=beds*occ*365,disc=obd/alos,ip=obd*ar/1e4,tot=ip*(1+op);
    const steps=[['Operational beds',fmt(beds)],['\u00D7 occupancy \u00D7 365 = occupied bed days',fmt(obd/1e5,2)+' lakh'],['\u00F7 ALOS = inpatient discharges',fmt(disc/1000,1)+'k'],['\u00D7 ARPOB = inpatient revenue','\u20B9'+fmt(ip)+' cr'],['+ outpatient and other = total revenue','\u20B9'+fmt(tot)+' cr']];
    $('#flow',root).innerHTML=steps.map(([a,b],i)=>`<div class="flow-step ${walk!=null&&i<=walk?'on':''}"><b>${a}</b><span class="num" style="font-size:16px;font-weight:700;color:var(--ink)">${b}</span></div>`).join('');
  };
  this.paint=paint;bindRanges(root,()=>paint());paint();
},
on(act,k,root){if(act==='walk'){let i=-1;clearInterval(this.t);this.t=setInterval(()=>{i++;this.paint(i);if(i>=4)clearInterval(this.t)},RM?50:600)}}});

/* ===== shell ===== */
function LOGO(s){return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#12294d"/><path d="M10 28V13l10 11 10-11v15" fill="none" stroke="#e3a72f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="10" r="2.4" fill="#e3a72f"/></svg>`}
const track=$('#track');
function goTo(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  const prev=SLIDES[S.i];if(prev&&prev.leave&&S.i!==i)prev.leave();
  S.i=i;S.seen.add(i);
  track.style.transform=`translateX(${-i*100}%)`;
  $$('.slide',track).forEach((s,j)=>{s.inert=j!==i;s.setAttribute('aria-hidden',j!==i)});
  const sl=SLIDES[i],root=$('#slide-'+sl.id);
  root.scrollTop=0;
  $('#nav-title').textContent=sl.title;$('#counter').textContent=`${i+1} / ${SLIDES.length}`;
  $('#prev').disabled=i===0;$('#next').disabled=i===SLIDES.length-1;$('#next2').disabled=i===SLIDES.length-1;
  $$('.dot').forEach((d,j)=>{d.setAttribute('aria-current',j===i);d.classList.toggle('seen',S.seen.has(j))});
  if(sl.enter)sl.enter(root);
  countUps(root);fillBars(root);
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}
}
function buildShell(){
  track.innerHTML=SLIDES.map(s=>`<section class="slide" id="slide-${s.id}" aria-label="${s.title}">${s.html()}</section>`).join('');
  SLIDES.forEach(s=>{const r=$('#slide-'+s.id);s.root=r;if(s.init)s.init(r)});
  $('#dots').innerHTML=SLIDES.map((s,i)=>`<button class="dot" aria-label="Go to slide ${i+1}: ${s.title}" data-go="${i}"><i></i></button>`).join('');
  $('#logo').innerHTML=LOGO(32);
}
function openIndex(){
  $('#index-list').innerHTML=SLIDES.map((s,i)=>`<button class="index-item ${i===S.i?'cur':''}" data-go="${i}" data-close="1"><span>${i+1}</span><b>${s.title}</b></button>`).join('');
  $('#scrim').classList.add('open');$('#index-list button.cur').focus();
}
function closeIndex(){$('#scrim').classList.remove('open')}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-goid],[data-act],#prev,#next,#next2,#counter,#scrim,#close-index');
  if(!t)return;
  if(t.id==='scrim'){if(e.target===t)closeIndex();return}
  if(t.id==='close-index'){closeIndex();return}
  if(t.id==='prev'){goTo(S.i-1);return}
  if(t.id==='next'||t.id==='next2'){goTo(S.i+1);return}
  if(t.id==='counter'){openIndex();return}
  if(t.dataset.goid){goId(t.dataset.goid);return}
  if(t.dataset.go!=null){goTo(+t.dataset.go);if(t.dataset.close)closeIndex();return}
  const act=t.dataset.act;
  if(act==='index'){openIndex();return}
  if(act==='replay'){SLIDES[0].start();return}
  const sl=SLIDES[S.i];
  if(sl.on)sl.on(act,t.dataset.k,$('#slide-'+sl.id),t);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeIndex();return}
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){goTo(S.i+1)}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){goTo(S.i-1)}
});
let tx=0,ty=0,tt=null;
$('#stage').addEventListener('touchstart',e=>{tt=e.target;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#stage').addEventListener('touchend',e=>{
  if(!tt||tt.closest('.noswipe,input,.chips'))return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)goTo(S.i+(dx<0?1:-1));
},{passive:true});
buildShell();
goTo(Math.max(0,Math.min(SLIDES.length-1,(parseInt(location.hash.slice(1))||1)-1)));

</script>
